# Base: vale para dev e produção. Em dev, o compose.override.yaml é carregado automaticamente.
services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
