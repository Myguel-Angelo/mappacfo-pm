[project]
name = "backend"
version = "0.1.0"
description = "API do MAPPA CFO 2.0"
authors = [
    { name = "Myguel Angelo", email = "angelo.nunes576@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
