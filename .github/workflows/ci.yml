name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: mappacfo
          POSTGRES_USER: mappacfo
          POSTGRES_PASSWORD: mappacfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mappacfo -d mappacfo"
          --health-interval 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-nao-e-segredo
      DJANGO_ALLOWED_HOSTS: localhost
      # No CI o Postgres é um serviço do job, acessível por localhost
      DATABASE_URL: postgres://mappacfo:mappacfo@localhost:5432/mappacfo

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      # --locked falha se o uv.lock estiver desatualizado em relação ao pyproject.toml
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
